# Machine-readable source-of-record / baseline metadata.
# Only explicit designations are recorded; omission is not a source inference.
# Confirmed-text keys are paths relative to confirmed-texts/.
# Collection folders are organizational and do not determine source_of_record.
# Zero-byte placeholders are omitted until populated and confirmed.
# For non-Psalm Scripture, see General Rules §§1.1 and 4.2: Mosul is the baseline witness,
# and an explicitly documented textual harmonization may supply the canonical reading.

