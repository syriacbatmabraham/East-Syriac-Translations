name: One-shot marhetana glossary migration

on:
  push:
    branches:
      - agent/direct-marhetana-encoding
    paths:
      - .github/workflows/migrate-marhetana-glossary.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v7
        with:
          ref: agent/direct-marhetana-encoding
          fetch-depth: 0
      - name: Apply exact glossary migration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("glossary/Glossary.md")
          text = path.read_text(encoding="utf-8")

          old_search = "and notation characters (`^` `_` `(` `)` `[` `]`) dropped. Collisions are expected. Human discretion is expected."
          new_search = "and notation characters (`^` `_` `(` `)` `[` `]` `⁀` `‿`) dropped. Collisions are expected. Human discretion is expected."

          old_entry = '''ܫܒܲܩ̣݇ܢ݇   [š-b-q]   {Peal perf. 1c.pl.}   (search: shbaqn)
          šba(q_n) (1) — have released (1)
          * šba(q_n) · "...as we have released our debtors" (Our Father Line 11)'''.replace("          ", "")
          new_entry = '''ܫܒܲܩ̣͞ܢ   [š-b-q]   {Peal perf. 1c.pl.}   (search: shbaqn)
          šbaq_⁀n (1) — have released (1)
          * šbaq_⁀n · "...as we have released our debtors" (Our Father Line 11)'''.replace("          ", "")

          assert text.count(old_search) == 1, f"expected one old search-key sentence, found {text.count(old_search)}"
          assert text.count(old_entry) == 1, f"expected one old šbaqn entry, found {text.count(old_entry)}"
          assert "ܫܒܲܩ̣͞ܢ" not in text
          assert "šbaq_⁀n" not in text

          text = text.replace(old_search, new_search).replace(old_entry, new_entry)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glossary/Glossary.md
          git diff --cached --check
          git commit -m "Migrate glossary marhetana notation"
          git push origin HEAD:agent/direct-marhetana-encoding
