name: Finish reviewed conceptual cleanup

on:
  pull_request_target:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    if: github.repository == 'syriacbatmabraham/East-Syriac-Translations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run corrected verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/9ca2f3d0bb9dbe463e1502b0b2a93ff804308d68/0c26e45800b601868d289e7347899020c8b59a16/' .github/workflows/cleanup-trigger.yml
          sed -i '/rm -f .github\/workflows\/apply-conceptual-cleanup.yml .github\/workflows\/cleanup-trigger.yml/a\          rm -f .github/workflows/cleanup-rescue.yml' .github/workflows/cleanup-trigger.yml
          awk '/^        run: \|$/ {found=1; next} found {sub(/^          /, ""); print}' .github/workflows/cleanup-trigger.yml > /tmp/cleanup.sh
          bash /tmp/cleanup.sh
