name: Apply rules and provenance cleanup

on:
  pull_request_target:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'syriacbatmabraham/East-Syriac-Translations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply cleanup and audit glossary
        shell: bash
        run: |
          set -euo pipefail
          python .cleanup/cleanup_and_audit.py | tee /tmp/glossary-audit.txt

          rm -rf .cleanup
          rm -f .github/workflows/cleanup-and-audit.yml

          git diff --check
          test -f sources/sources.yaml
          test ! -e .cleanup
          test ! -e .github/workflows/cleanup-and-audit.yml

          git config user.name 'syriacbatmabraham'
          git config user.email 'batmabraham@users.noreply.github.com'
          git add -A
          git commit -m 'Clarify glossary identity and provenance'
          git push origin HEAD:main
