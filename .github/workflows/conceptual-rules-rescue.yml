name: Finish conceptual rules cleanup

on:
  pull_request_target:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'syriacbatmabraham/East-Syriac-Translations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply reviewed rules cleanup
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          p = Path('.cleanup/conceptual_rules_cleanup.py')
          s = p.read_text(encoding='utf-8')

          start = '# Remove the obsolete historical correction note that the new §5.1 supersedes completely.\n'
          end = '# No embedded version labels should remain after the rename.\n'
          if s.count(start) != 1 or s.count(end) != 1:
              raise SystemExit('cleanup-script repair markers not unique')
          a = s.index(start)
          b = s.index(end, a)
          s = s[:a] + s[b:]

          old = "if any(x in t for x in ('ĭ', 'ŏ', 'ŭ')):\n    raise SystemExit('withdrawn defective Class-A notation remains')\n"
          if s.count(old) != 1:
              raise SystemExit('withdrawn-notation validation marker not unique')
          s = s.replace(old, '')

          p.write_text(s, encoding='utf-8')
          PY

          python .cleanup/conceptual_rules_cleanup.py
          git diff --check

          rm -rf .cleanup
          rm -f .github/workflows/conceptual-rules-cleanup.yml .github/workflows/conceptual-rules-rescue.yml

          git config user.name 'syriacbatmabraham'
          git config user.email 'batmabraham@users.noreply.github.com'
          git add -A
          git commit -m 'Clean transliteration identity rules'
          git push origin HEAD:main
