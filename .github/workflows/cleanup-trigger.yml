name: Apply staged conceptual cleanup

on:
  pull_request_target:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'syriacbatmabraham/East-Syriac-Translations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and verify staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .cleanup/patch.b64.* | tr -d '\n' | base64 -d > /tmp/conceptual-cleanup.patch
          git apply --check /tmp/conceptual-cleanup.patch
          git apply /tmp/conceptual-cleanup.patch

          test "$(git hash-object rules/General-Rules.md)" = "4d00e2fe38460dcf6dfb5eacec89fd05b9b72067"
          test "$(git hash-object rules/Transliteration-Rules-v2_3_1.md)" = "9ca2f3d0bb9dbe463e1502b0b2a93ff804308d68"
          test "$(git hash-object glossary/Glossary.md)" = "dfa0743af1ab80cfa01b6de7f268eaa6c0a2fdf1"
          git diff --check

          rm -rf .cleanup
          rm -f .github/workflows/apply-conceptual-cleanup.yml .github/workflows/cleanup-trigger.yml

          git config user.name "syriacbatmabraham"
          git config user.email "batmabraham@users.noreply.github.com"
          git add -A
          git commit -m "Clean conceptual rules and glossary"
          git push origin HEAD:main
