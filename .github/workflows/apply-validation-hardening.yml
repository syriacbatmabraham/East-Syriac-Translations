name: Apply validation hardening

on:
  push:
    branches:
      - "agent/glossary-validation-hardening"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[validation-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/glossary-validation-hardening
      - name: Apply exact patch
        run: python tools/apply_validation_hardening.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rules/General-Rules.md tools/east_syriac/glossary.py tools/east_syriac/confirmed_text.py tools/tests/test_confirmed_text.py .github/workflows/tools-tests.yml tools/README.md
          if git diff --cached --quiet; then
            echo "Patch already applied"
          else
            git commit -m "Complete validation hardening [validation-patch]"
            git push origin HEAD:agent/glossary-validation-hardening
          fi
