name: Psalm 15 glossary integration retry

on:
  push:
    branches:
      - agent/psalm-15-integration

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/psalm-15-integration
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply approved glossary integration with explicit Mar Yah occurrences
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/psalm15-glossary-integration.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('Could not uniquely extract original integration script')
          code = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          code = textwrap.dedent(code)

          old = '''        "māryā (22) — Mar Yah (20+2)",
          (),'''
          new = '''        "māryā (22) — Mar Yah (22)",
          (
              '* māryā · "Mar Yah, who will dwell in Your Tabernacle?" (Psalm 15 Line 1)',
              '* dmāryā · "And he honors those who fear Mar Yah" (Psalm 15 Line 11)',
          ),'''
          if code.count(old) != 1:
              raise SystemExit(f'Expected one Mar Yah patch target, found {code.count(old)}')
          code = code.replace(old, new)
          exec(compile(code, '<psalm15-glossary-integration>', 'exec'))
          PY
      - name: Validate complete repository state
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -v
          python tools/check_confirmed_text.py confirmed-texts
          python tools/check_glossary.py
      - name: Commit validated Psalm 15 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/psalm15-glossary-integration.yml
          git rm .github/workflows/psalm15-glossary-integration-retry.yml
          git add glossary/Glossary.md
          git diff --cached --check
          git commit -m "Index Psalm 15 in glossary"
          git push origin HEAD:agent/psalm-15-integration
