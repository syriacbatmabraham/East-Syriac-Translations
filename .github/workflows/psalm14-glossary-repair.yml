name: Psalm 14 glossary repair

on:
  push:
    branches:
      - agent/psalm-14-integration

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/psalm-14-integration
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply exact glossary repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("glossary/Glossary.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "takes ordinary nominal gender, number and state, and pronominal-suffix morphology.",
                  "takes ordinary nominal gender, number, state, and pronominal-suffix morphology.",
              ),
              (
                  "| Ethpaal | passive or reflexive of Paal | `ʾeṫtaqanw` they were established |",
                  "| Ethpaal | passive or reflexive of Pael | `ʾeṫtaqanw` they were established |",
              ),
              (
                  "* wʾēqūm · \"Mar Yah has said: I will now arise\" (Psalm 12 Line 14)",
                  "* ʾēqūm · \"Mar Yah has said: I will now arise\" (Psalm 12 Line 14)",
              ),
              (
                  "tsim (1) — will You place (1)\n* tsim · \"How long will You place sorrow in my soul?\" (Psalm 13 Line 6)",
                  "tsīm (1) — will You place (1)\n* tsīm · \"How long will You place sorrow in my soul?\" (Psalm 13 Line 6)",
              ),
              (
                  "ܠܹܒ݁ܝ   [l-b-b]   {noun m.sg.emph. + 1cs suff.}   (search: lebi)",
                  "ܠܹܒ݁ܝ   [l-b-b]   {noun m.sg.emph. + 1cs suff.}   (search: leby)",
              ),
              (
                  "layṫ (2) — is not there (1), there is no one (1)\n* dlayṫ · \"...God is not there\" (Psalm 14 Line 1)\n* wlayṫ · \"And there is no one doing good\" (Psalm 14 Line 6)",
                  "layṫ (3) — is not there (1), there is no one (2)\n* dlayṫ · \"...God is not there\" (Psalm 14 Line 1)\n* wlayṫ · \"And there is no one doing good\" (Psalm 14 Line 6)\n* wlayṫ · \"And there is no one doing good - not even one\" (Psalm 14 Line 10)",
              ),
              (
                  "ʿā^^bēḏ (1) — doing (1)\n* dʿā^^bēḏ · \"And there is no one doing good\" (Psalm 14 Line 6)",
                  "ʿā^^bēḏ (2) — doing (2)\n* dʿā^^bēḏ · \"And there is no one doing good\" (Psalm 14 Line 6)\n* dʿā^^bēḏ · \"And there is no one doing good - not even one\" (Psalm 14 Line 10)",
              ),
              (
                  "ṭāḇṯā (1) — good (1)\n* ṭāḇṯā · \"And there is no one doing good\" (Psalm 14 Line 6)",
                  "ṭāḇṯā (2) — good (2)\n* ṭāḇṯā · \"And there is no one doing good\" (Psalm 14 Line 6)\n* ṭāḇṯā · \"And there is no one doing good - not even one\" (Psalm 14 Line 10)",
              ),
              (
                  "īdaʿ_w (1) — have known (1)",
                  "īdaʿ_w (1) — have not known (1)",
              ),
              (
                  "q_rāw (1) — have called (1)",
                  "q_rāw (1) — have not called (1)",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, got {count}: {old!r}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Commit repaired glossary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glossary/Glossary.md
          git diff --cached --check
          git commit -m "Repair Psalm 14 glossary integration"
          git push origin HEAD:agent/psalm-14-integration
