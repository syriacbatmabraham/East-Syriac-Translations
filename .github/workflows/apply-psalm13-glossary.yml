name: Apply Psalm 13 glossary

on:
  push:
    branches:
      - "agent/psalm-13-confirmation"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/psalm-13-confirmation
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply glossary changes
        run: python tools/apply_psalm13_glossary.py
      - name: Run deterministic tests
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -v
          python tools/check_confirmed_text.py confirmed-texts
          python tools/check_glossary.py
      - name: Commit generated glossary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glossary/Glossary.md
          git rm tools/apply_psalm13_glossary.py .github/workflows/apply-psalm13-glossary.yml
          git commit -m "Apply Psalm 13 glossary"
          git push origin HEAD:agent/psalm-13-confirmation
