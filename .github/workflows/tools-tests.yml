name: Tools tests

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tools
        run: python -m compileall -q tools
      - name: Run deterministic tool tests
        run: python -m unittest discover -s tools/tests -v
      - name: Check confirmed corpus
        run: python tools/check_confirmed_text.py confirmed-texts
